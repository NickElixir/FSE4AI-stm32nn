name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  wheel:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff
        run: |
          python -m pip install ruff
          ruff check .
      - name: wheel, fresh install, pytest, demo
        run: ./tools/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU wheel and Cortex-M55 object
        run: docker build -t stm32nn:ci .
      - name: pytest from installed wheel
        run: docker run --rm stm32nn:ci
      - name: demo
        run: docker run --rm stm32nn:ci python3 /opt/demo.py
