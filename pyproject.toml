[build-system]
requires = ["setuptools>=61", "torch==2.12.1"]
build-backend = "setuptools.build_meta"

[project]
name = "stm32nn"
version = "0.1.0"
description = "CPU PyTorch op: round float32 values to IEEE FP16 and store them as float32."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Alexander Bashirov", email = "Aleksandr.Bashirov@skoltech.ru" },
    { name = "Nikolai Lutsenko", email = "Nikolai.Lutsenko@skoltech.ru" },
    { name = "Egor", email = "Egor@skoltech.ru" },
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist"]
